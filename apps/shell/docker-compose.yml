version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shell-postgres
    environment:
      POSTGRES_USER: shell
      POSTGRES_PASSWORD: shell123
      POSTGRES_DB: shell_apps
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  healthcare-db:
    image: postgres:15-alpine
    container_name: healthcare-postgres
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare123
      POSTGRES_DB: healthcare
    ports:
      - "5434:5432"
    volumes:
      - healthcare_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  healthcare_data:
