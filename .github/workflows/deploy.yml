name: Deploy to Production

on:
  push:
    branches:
      - master

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force build all apps'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  SERVER_IP: '10.30.10.18'
  SERVER_USER: 'honghoang'
  REMOTE_HOST: 'http://10.30.10.18'

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      shell: ${{ steps.changes.outputs.shell }}
      healthcare-admin: ${{ steps.changes.outputs.healthcare-admin }}
      healthcare-marketing: ${{ steps.changes.outputs.healthcare-marketing }}
      any-remote-changed: ${{ steps.changes.outputs.any-remote-changed }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: changes
        run: |
          if [ "${{ github.event.inputs.force_all }}" == "true" ]; then
            echo "Force build all apps"
            echo "shell=true" >> $GITHUB_OUTPUT
            echo "healthcare-admin=true" >> $GITHUB_OUTPUT
            echo "healthcare-marketing=true" >> $GITHUB_OUTPUT
            echo "any-remote-changed=true" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get changed files between current and previous commit
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check each app for changes
          SHELL_CHANGED=false
          HEALTHCARE_CHANGED=false
          HEALTHCARE_MARKETING_CHANGED=false

          if echo "$CHANGED_FILES" | grep -q "^apps/shell/"; then
            SHELL_CHANGED=true
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/healthcare-admin/"; then
            HEALTHCARE_CHANGED=true
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/healthcare-marketing/"; then
            HEALTHCARE_MARKETING_CHANGED=true
          fi

          # Check if any remote app changed
          ANY_REMOTE_CHANGED=false
          if [ "$HEALTHCARE_CHANGED" = "true" ] || [ "$HEALTHCARE_MARKETING_CHANGED" = "true" ]; then
            ANY_REMOTE_CHANGED=true
          fi

          # Check if there are any changes to deploy
          HAS_CHANGES=false
          if [ "$SHELL_CHANGED" = "true" ] || [ "$ANY_REMOTE_CHANGED" = "true" ]; then
            HAS_CHANGES=true
          fi

          # Root-level changes trigger full rebuild
          if echo "$CHANGED_FILES" | grep -q "^package.json$\|^pnpm-lock.yaml$\|^pnpm-workspace.yaml$"; then
            echo "Root config changed, building all"
            SHELL_CHANGED=true
            HEALTHCARE_CHANGED=true
            HEALTHCARE_MARKETING_CHANGED=true
            ANY_REMOTE_CHANGED=true
            HAS_CHANGES=true
          fi

          echo "shell=$SHELL_CHANGED" >> $GITHUB_OUTPUT
          echo "healthcare-admin=$HEALTHCARE_CHANGED" >> $GITHUB_OUTPUT
          echo "healthcare-marketing=$HEALTHCARE_MARKETING_CHANGED" >> $GITHUB_OUTPUT
          echo "any-remote-changed=$ANY_REMOTE_CHANGED" >> $GITHUB_OUTPUT
          echo "has-changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

          echo "---"
          echo "Summary:"
          echo "  Shell: $SHELL_CHANGED"
          echo "  Healthcare Admin: $HEALTHCARE_CHANGED"
          echo "  Healthcare Marketing: $HEALTHCARE_MARKETING_CHANGED"
          echo "  Any Remote Changed: $ANY_REMOTE_CHANGED"
          echo "  Has Changes: $HAS_CHANGES"

  build-and-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build changed apps
        run: |
          export REMOTE_HOST=${{ env.REMOTE_HOST }}

          # Build shell if it changed OR if any remote changed
          if [ "${{ needs.detect-changes.outputs.shell }}" == "true" ] || [ "${{ needs.detect-changes.outputs.any-remote-changed }}" == "true" ]; then
            echo "Building shell..."
            cd apps/shell
            npx webpack --config webpack.config.prod.js
            cd ../..
          fi

          if [ "${{ needs.detect-changes.outputs.healthcare-admin }}" == "true" ]; then
            echo "Building healthcare-admin..."
            cd apps/healthcare-admin
            npx webpack --config webpack.config.prod.js
            cd ../..
          fi

          if [ "${{ needs.detect-changes.outputs.healthcare-marketing }}" == "true" ]; then
            echo "Building healthcare-marketing..."
            cd apps/healthcare-marketing
            npx webpack --config webpack.config.prod.js
            cd ../..
          fi

          echo "Build complete!"

      - name: Create deployment package
        run: |
          INCLUDE_PATHS=""

          if [ "${{ needs.detect-changes.outputs.shell }}" == "true" ] || [ "${{ needs.detect-changes.outputs.any-remote-changed }}" == "true" ]; then
            INCLUDE_PATHS="$INCLUDE_PATHS apps/shell/dist apps/shell/package.json"
          fi

          if [ "${{ needs.detect-changes.outputs.healthcare-admin }}" == "true" ]; then
            INCLUDE_PATHS="$INCLUDE_PATHS apps/healthcare-admin/dist apps/healthcare-admin/package.json"
          fi

          if [ "${{ needs.detect-changes.outputs.healthcare-marketing }}" == "true" ]; then
            INCLUDE_PATHS="$INCLUDE_PATHS apps/healthcare-marketing/dist apps/healthcare-marketing/package.json"
          fi

          INCLUDE_PATHS="$INCLUDE_PATHS ecosystem.config.js package.json"

          echo "Creating deployment package with: $INCLUDE_PATHS"
          tar -czf deploy.tar.gz $INCLUDE_PATHS

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SHELL_CHANGED: ${{ needs.detect-changes.outputs.shell == 'true' || needs.detect-changes.outputs.any-remote-changed == 'true' }}
          HEALTHCARE_CHANGED: ${{ needs.detect-changes.outputs.healthcare-admin }}
          HEALTHCARE_MARKETING_CHANGED: ${{ needs.detect-changes.outputs.healthcare-marketing }}
        run: |
          scp deploy.tar.gz ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:~/microfrontend/deploy.tar.gz

          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_IP }} << ENDSSH
          export NVM_DIR="\$HOME/.nvm"
          [ -s "\$NVM_DIR/nvm.sh" ] && \\. "\$NVM_DIR/nvm.sh"

          cd ~/microfrontend

          backup_app() {
            local app_path="\$1"
            if [ -d "apps/\${app_path}/dist" ]; then
              rm -rf "apps/\${app_path}/dist.backup" 2>/dev/null || true
              mv "apps/\${app_path}/dist" "apps/\${app_path}/dist.backup" 2>/dev/null || true
            fi
          }

          if [ "$SHELL_CHANGED" == "true" ]; then backup_app "shell"; fi
          if [ "$HEALTHCARE_CHANGED" == "true" ]; then backup_app "healthcare-admin"; fi
          if [ "$HEALTHCARE_MARKETING_CHANGED" == "true" ]; then backup_app "healthcare-marketing"; fi

          tar -xzf deploy.tar.gz
          rm deploy.tar.gz

          PM2_LIST=\$(pm2 jlist 2>/dev/null || echo "[]")
          if [ "\$PM2_LIST" == "[]" ] || ! echo "\$PM2_LIST" | grep -q '"name":"shell"'; then
            echo "PM2 processes not found, starting ecosystem..."
            pm2 start ecosystem.config.js
          else
            RESTART_APPS=""
            if [ "$SHELL_CHANGED" == "true" ]; then RESTART_APPS="\$RESTART_APPS shell"; fi
            if [ "$HEALTHCARE_CHANGED" == "true" ]; then RESTART_APPS="\$RESTART_APPS healthcare-admin"; fi
            if [ "$HEALTHCARE_MARKETING_CHANGED" == "true" ]; then RESTART_APPS="\$RESTART_APPS healthcare-marketing"; fi

            echo "Restarting apps:\$RESTART_APPS"
            for app in \$RESTART_APPS; do
              pm2 restart \$app || echo "Warning: Failed to restart \$app"
            done
          fi
          pm2 save

          echo "Deployment completed!"
          pm2 list
          ENDSSH

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** ${{ env.SERVER_IP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** master" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Apps Deployed" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.shell }}" == "true" ] || [ "${{ needs.detect-changes.outputs.any-remote-changed }}" == "true" ]; then
            echo "- ✅ Shell: http://${{ env.SERVER_IP }}:3100" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.detect-changes.outputs.healthcare-admin }}" == "true" ]; then
            echo "- ✅ Healthcare Admin: http://${{ env.SERVER_IP }}:3101" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.detect-changes.outputs.healthcare-marketing }}" == "true" ]; then
            echo "- ✅ Healthcare Marketing: http://${{ env.SERVER_IP }}:3109" >> $GITHUB_STEP_SUMMARY
          fi
